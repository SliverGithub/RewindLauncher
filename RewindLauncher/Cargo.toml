[package]
name = "Rewind-Launcher"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25.10"
mlua = { version = "0.12.3", features = ["lua54", "vendored"] }
slint = "1.19.0"
walkdir = "2.5.1"
zip = "9.8.2"

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
codegen-units = 1
lto = true
